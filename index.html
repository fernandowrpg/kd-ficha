<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karyu Densetsu — Ficha</title>
  <meta name="description" content="Construtor de fichas de A Lenda do Dragão de Fogo: Karyu Densetsu para jogar presencialmente pelo celular.">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karyu Ficha">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <script>
    // Aplica o tema antes de pintar (evita piscar claro→escuro).
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('kd-tema') || 'null'); } catch (e) {}
      var tema = t && t.tema ? t.tema : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toast-root" aria-live="polite"></div>
  <noscript>Este app precisa de JavaScript.</noscript>
  <script src="js/data.js"></script>
  <script src="js/tecnicas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
